      let activeCategory = null;

      function renderCategories() {
        const container = document.getElementById('categoryContainer');
        container.innerHTML = '';

        categoryData.forEach((cat) => {
          const isOpen = cat.id === activeCategory;
          const categoryWrapper = document.createElement('div');
          categoryWrapper.className = 'bg-white rounded-2xl border border-slate-200/70 shadow-sm overflow-hidden transition-all duration-300';
          categoryWrapper.dataset.categoryId = cat.id;

          const button = document.createElement('button');
          button.className = `w-full flex items-center justify-between p-3.5 md:p-4 text-left font-bold transition-all duration-300 ${isOpen ? 'bg-pink-50 text-pink-600 border-b border-pink-100' : 'bg-white text-slate-800 hover:bg-slate-50'}`;

          // Perhatikan bagian ${cat.icon} di bawah ini memanggil langsung tag <img> yang ada di data atas
          button.innerHTML = `
                        <div class="flex items-center gap-3">
                          <div class="w-8 h-8 md:w-9 md:h-9 rounded-xl flex items-center justify-center ${isOpen ? 'bg-pink-100 shadow-sm' : 'bg-slate-100'}">
                            ${cat.icon}
                          </div>
                          <span class="text-xs md:text-sm">${cat.name}</span>
                        </div>
                        <div class="w-6 h-6 md:w-7 md:h-7 rounded-full flex items-center justify-center transition-transform duration-300 ${isOpen ? 'rotate-180 text-pink-600 bg-pink-100/60' : 'text-slate-400'}">
                          <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                      `;

          button.onclick = () => {
            activeCategory = isOpen ? null : cat.id;
            renderCategories();

            if (activeCategory) {
              requestAnimationFrame(() => {
                const openedCategory = document.querySelector(`[data-category-id="${activeCategory}"]`);

                if (openedCategory) {
                  openedCategory.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start',
                  });
                }
              });
            }
          };

          categoryWrapper.appendChild(button);

          if (isOpen) {
            const itemsContainer = document.createElement('div');
            itemsContainer.className = 'p-3 space-y-3 bg-slate-50/50';

            if (cat.items.length === 0) {
              itemsContainer.innerHTML = `<p class="text-center text-slate-400 py-4 text-xs">Belum ada link di kategori ini.</p>`;
            } else {
              cat.items.forEach((item) => {
                const isShopee = item.platform.toLowerCase() === 'shopee';
                const badgeBg = isShopee ? 'bg-orange-100 text-orange-700 border-orange-200' : 'bg-slate-900 text-white border-slate-700';
                const badgeText = isShopee ? 'Shopee' : 'TikTok Shop';
                const badgeIcon = isShopee ? 'fa-bag-shopping' : 'fa-tiktok';

                const card = document.createElement('a');
                card.href = item.url;
                card.target = '_blank';
                card.className = 'flex items-center gap-3.5 bg-white p-3 rounded-xl border border-slate-200/70 shadow-sm hover:shadow-md hover:border-pink-300 transition-all duration-300 group block';

                card.innerHTML = `
                              <div class="relative w-14 h-14 md:w-16 md:h-16 flex-shrink-0">
                                <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover rounded-lg border border-slate-100 group-hover:scale-105 transition duration-300">
                              </div>
                              <div class="flex-grow min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                  <span class="text-[9px] font-bold px-2 py-0.5 rounded-full border ${badgeBg}">
                                    <i class="fa-brands ${badgeIcon} mr-1"></i>${badgeText}
                                  </span>
                                </div>
                                <h2 class="text-xs md:text-sm font-bold text-slate-800 truncate group-hover:text-pink-600 transition">${item.title}</h2>
                                <p class="text-[11px] text-slate-500 line-clamp-1 mt-0.5">${item.desc}</p>
                              </div>
                              <div class="flex-shrink-0 text-slate-300 group-hover:text-pink-500 pr-1 transition">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                              </div>
                            `;
                itemsContainer.appendChild(card);
              });
            }

            categoryWrapper.appendChild(itemsContainer);
          }

          container.appendChild(categoryWrapper);
        });
      }

      renderCategories();
    </script>
